name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  latest:
    name: Python ${{ matrix.python }}, latest dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]" pytest-github-actions-annotate-failures
      - run: pytest -q

  lowest:
    name: Python 3.9, lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # The floors pyproject.toml allows.
      - run: pip install "paramiko==3.3.2" "scp==0.14.5" "docker==5.0.3" "tenacity==8.0.1" "pytest==7.0.1" "pytest-mock==3.10.0" pytest-github-actions-annotate-failures -e .
      - run: pytest -q

  package:
    name: Build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - run: pip install "$(ls dist/*.whl)[test]" pytest-github-actions-annotate-failures
      # From a directory without src/, so the tests import the installed wheel.
      - run: cp -r tests /tmp/tests && cd /tmp && pytest -q tests
