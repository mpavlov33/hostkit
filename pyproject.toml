[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hostkit"
version = "0.1.0"
description = "Hosts over SSH or Docker, testinfra-style: files, processes, packages, services, docker, SELinux, sysctl and long-running commands."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Mihail Pavlov"}]
requires-python = ">=3.9"
dependencies = [
    "paramiko>=3.3,<4",
    "scp>=0.14,<1",
    "docker>=5.0,<8",
    "tenacity>=8",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-mock>=3.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
